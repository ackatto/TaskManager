<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Менеджер задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Мои задачи</h1>

    <form id="create-form">
        <input type="text" name="title" placeholder="Название" required>
        <input type="text" name="description" placeholder="Описание">
        <input type="date" name="dueDate">
        <button type="submit">Добавить</button>
    </form>

    <h2>Текущие задачи</h2>
    <ul id="active-tasks"></ul>

    <h2>Выполненные задачи</h2>
    <ul id="completed-tasks"></ul>

    <div id="edit-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Редактировать задачу</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <label>Название: <input type="text" id="edit-title" required></label>
                <label>Описание: <input type="text" id="edit-description"></label>
                <label>Срок: <input type="date" id="edit-dueDate"></label>
                <label><input type="checkbox" id="edit-isCompleted"> Выполнена</label>
                <button type="submit">Сохранить</button>
                <button type="button" onclick="closeModal()">Отмена</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
